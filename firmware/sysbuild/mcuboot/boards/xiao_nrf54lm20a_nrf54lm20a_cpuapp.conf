CONFIG_HW_STACK_PROTECTION=n
CONFIG_BOOT_WATCHDOG_FEED=n

# PY25Q64 external SPI NOR flash holds the secondary (DFU) slot
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# See NCS nrf54lm20dk MCUboot config: SYSCOUNTER after soft reset
CONFIG_TICKLESS_KERNEL=y
